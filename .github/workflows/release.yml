name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  GO_VERSION: '1.27.0'
  GORELEASER_VERSION: v2.18.0
  SYFT_VERSION: v1.51.1

jobs:
  quality:
    name: Gate release with non-live quality suite
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - name: Set up Go
        uses: actions/setup-go@v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: Install GoReleaser
        uses: goreleaser/goreleaser-action@v7.2.3
        with:
          distribution: goreleaser
          version: ${{ env.GORELEASER_VERSION }}
          install-only: true
      - name: Install Syft
        uses: anchore/sbom-action/download-syft@v0.24.2
        with:
          syft-version: ${{ env.SYFT_VERSION }}
      - name: Run complete non-live verification
        run: make verify
      - name: Run release snapshot verification
        run: make release-check
      - name: Run container verification
        run: make test-container

  publish:
    name: Publish release and GHCR image
    needs: quality
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - name: Check out
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - name: Set up Go
        uses: actions/setup-go@v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: Log in to GHCR
        uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.3.0
      - name: Install Syft
        uses: anchore/sbom-action/download-syft@v0.24.2
        with:
          syft-version: ${{ env.SYFT_VERSION }}
      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v7.2.3
        with:
          distribution: goreleaser
          version: ${{ env.GORELEASER_VERSION }}
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify published image manifest
        run: sh scripts/check-image.sh ghcr.io/manprint/tgsend:${GITHUB_REF_NAME}
